<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="35%" stop-color="#FFB800"/>
      <stop offset="70%" stop-color="#E58A00"/>
      <stop offset="100%" stop-color="#B26500"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="50%" stop-color="#0077FE"/>
      <stop offset="100%" stop-color="#052E74"/>
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB800" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#00D2FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF3366" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Aura/Glow -->
  <circle cx="95" cy="88" r="62" fill="url(#blueGrad)" opacity="0.22" filter="url(#glow)"/>
  
  <!-- Dynamic Cricket Orbit / Swoosh -->
  <path d="M 32 120 C 18 78, 55 32, 102 34 C 145 36, 168 72, 158 114 C 150 146, 110 160, 75 152 C 55 147, 40 136, 32 120" 
        fill="none" stroke="url(#glowRing)" stroke-width="5" stroke-linecap="round" stroke-dasharray="160 12" filter="url(#glow)"/>
        
  <path d="M 45 135 C 28 95, 62 48, 110 48 C 150 48, 175 80, 165 125" 
        fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Orbiting Cricket Seam Ball -->
  <circle cx="158" cy="114" r="8" fill="#E11D48" filter="url(#glow)"/>
  <circle cx="158" cy="114" r="8" fill="url(#goldGrad)" opacity="0.4"/>
  <path d="M 152 114 A 6 6 0 0 1 164 114" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-dasharray="1.5 1"/>

  <!-- Batsman Silhouette (Striking dynamic hook/pull shot) -->
  <g transform="translate(48, 28) scale(0.95)" filter="url(#softShadow)">
    <!-- Head / Helmet & Grille -->
    <ellipse cx="44" cy="22" rx="6.5" ry="7.5" fill="url(#goldGrad)"/>
    <path d="M 46 22 L 53 25 L 48 27 Z" fill="#FFE885"/> <!-- Peak/grille -->
    
    <!-- Torso / Jersey (Leaning forward into shot) -->
    <path d="M 38 31 C 42 28, 48 28, 53 32 L 56 48 C 50 51, 42 50, 36 46 Z" fill="#FFFFFF"/>
    
    <!-- Arms & Cricket Bat Swing -->
    <!-- Back arm -->
    <path d="M 39 33 L 30 42 L 35 48" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Front arm holding bat -->
    <path d="M 52 34 L 59 45 L 68 38" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bat handle & blade sweeping high -->
    <line x1="68" y1="38" x2="74" y2="33" stroke="#D1D5DB" stroke-width="3" stroke-linecap="round"/>
    <!-- Bat blade -->
    <polygon points="74,33 96,16 100,20 78,37" fill="url(#goldGrad)"/>
    <polygon points="75,34 94,18 97,21 78,36" fill="#FFF4BD" opacity="0.8"/>
    
    <!-- Pads & Legs -->
    <!-- Front leg bent -->
    <path d="M 52 48 L 58 66 L 68 85" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="68" cy="85" rx="5" ry="3.5" fill="url(#goldGrad)"/>
    <!-- Back leg driving back -->
    <path d="M 38 46 L 30 62 L 24 82" fill="none" stroke="#CBD5E1" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="23" cy="83" rx="4.5" ry="3" fill="#94A3B8"/>
    <!-- Dynamic motion trails -->
    <path d="M 98 14 C 108 8, 120 18, 115 32" fill="none" stroke="url(#blueGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Typography: IPL -->
  <g transform="translate(162, 32)">
    <!-- Drop Glow Shadow for text -->
    <text x="3" y="68" font-family="'Outfit', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="64" letter-spacing="2" fill="#000000" opacity="0.6">IPL</text>
    <!-- Main IPL text -->
    <text x="0" y="65" font-family="'Outfit', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="64" letter-spacing="2" fill="url(#goldGrad)" filter="url(#softShadow)">IPL</text>
    
    <!-- Decorative Stars -->
    <g transform="translate(112, 18) scale(0.7)" fill="url(#goldGrad)">
      <polygon points="10,1 12,7 18,7 13,11 15,17 10,13 5,17 7,11 2,7 8,7"/>
    </g>
    <g transform="translate(125, 26) scale(0.55)" fill="#00D2FF">
      <polygon points="10,1 12,7 18,7 13,11 15,17 10,13 5,17 7,11 2,7 8,7"/>
    </g>

    <!-- Subtitle: INDIAN PREMIER LEAGUE -->
    <rect x="0" y="78" width="144" height="2" fill="url(#blueGrad)" rx="1"/>
    <text x="1" y="93" font-family="'Outfit', 'DM Sans', sans-serif" font-weight="800" font-size="9" letter-spacing="3.2" fill="#FFFFFF">INDIAN PREMIER LEAGUE</text>
    <text x="1" y="105" font-family="'Outfit', 'DM Sans', sans-serif" font-weight="700" font-size="7.5" letter-spacing="2.5" fill="#38BDF8">CRICKET INTELLIGENCE</text>
  </g>
</svg>
